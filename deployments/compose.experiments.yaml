      SBR_BACKEND_QUEUE_CAPACITY: "${SBR_BACKEND_D_QUEUE_CAPACITY:-32}"
      SBR_BACKEND_PROCESSING_DELAY: "${SBR_BACKEND_D_PROCESSING_DELAY:-120ms}"
      SBR_BACKEND_PROCESSING_JITTER: "${SBR_BACKEND_D_PROCESSING_JITTER:-30ms}"
      SBR_BACKEND_DELAY_SEED: "${SBR_BACKEND_D_DELAY_SEED:-104}"
      SBR_BACKEND_ADMIN_ENABLED: "${SBR_BACKEND_D_ADMIN_ENABLED:-true}"
      SBR_BACKEND_ADMIN_LISTEN_ADDR: "${SBR_BACKEND_D_ADMIN_LISTEN_ADDR:-0.0.0.0:9090}"
      SBR_BACKEND_ADMIN_TOKEN: "${SBR_BACKEND_ADMIN_TOKEN:?SBR_BACKEND_ADMIN_TOKEN is required when experimental administration is enabled}"
    ports:
