services:
  proxy:
    environment:
      SBR_PROXY_POLICY: "${SBR_PROXY_POLICY:-round-robin}"

  backend-a:
    environment:
      SBR_BACKEND_WORKERS: "${SBR_BACKEND_A_WORKERS:-4}"
      SBR_BACKEND_QUEUE_CAPACITY: "${SBR_BACKEND_A_QUEUE_CAPACITY:-32}"
      SBR_BACKEND_PROCESSING_DELAY: "${SBR_BACKEND_A_PROCESSING_DELAY:-20ms}"
      SBR_BACKEND_PROCESSING_JITTER: "${SBR_BACKEND_A_PROCESSING_JITTER:-5ms}"
      SBR_BACKEND_DELAY_SEED: "${SBR_BACKEND_A_DELAY_SEED:-101}"
      SBR_BACKEND_ADMIN_ENABLED: "${SBR_BACKEND_A_ADMIN_ENABLED:-true}"
      SBR_BACKEND_ADMIN_LISTEN_ADDR: "${SBR_BACKEND_A_ADMIN_LISTEN_ADDR:-0.0.0.0:9090}"
      SBR_BACKEND_ADMIN_TOKEN: "${SBR_BACKEND_ADMIN_TOKEN:?SBR_BACKEND_ADMIN_TOKEN is required when experimental administration is enabled}"
    ports:
      - "127.0.0.1:${SBR_BACKEND_A_ADMIN_PORT:-19091}:9090"
    networks:
      - default
      - ingress

  backend-b:
    environment:
      SBR_BACKEND_WORKERS: "${SBR_BACKEND_B_WORKERS:-4}"
      SBR_BACKEND_QUEUE_CAPACITY: "${SBR_BACKEND_B_QUEUE_CAPACITY:-32}"
      SBR_BACKEND_PROCESSING_DELAY: "${SBR_BACKEND_B_PROCESSING_DELAY:-40ms}"
      SBR_BACKEND_PROCESSING_JITTER: "${SBR_BACKEND_B_PROCESSING_JITTER:-10ms}"
      SBR_BACKEND_DELAY_SEED: "${SBR_BACKEND_B_DELAY_SEED:-102}"
      SBR_BACKEND_ADMIN_ENABLED: "${SBR_BACKEND_B_ADMIN_ENABLED:-true}"
      SBR_BACKEND_ADMIN_LISTEN_ADDR: "${SBR_BACKEND_B_ADMIN_LISTEN_ADDR:-0.0.0.0:9090}"
      SBR_BACKEND_ADMIN_TOKEN: "${SBR_BACKEND_ADMIN_TOKEN:?SBR_BACKEND_ADMIN_TOKEN is required when experimental administration is enabled}"
    ports:
      - "127.0.0.1:${SBR_BACKEND_B_ADMIN_PORT:-19092}:9090"
    networks:
      - default
      - ingress

  backend-c:
    environment:
      SBR_BACKEND_WORKERS: "${SBR_BACKEND_C_WORKERS:-4}"
      SBR_BACKEND_QUEUE_CAPACITY: "${SBR_BACKEND_C_QUEUE_CAPACITY:-32}"
