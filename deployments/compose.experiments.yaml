      SBR_BACKEND_PROCESSING_JITTER: "${SBR_BACKEND_C_PROCESSING_JITTER:-20ms}"
      SBR_BACKEND_DELAY_SEED: "${SBR_BACKEND_C_DELAY_SEED:-103}"
      SBR_BACKEND_ADMIN_ENABLED: "${SBR_BACKEND_C_ADMIN_ENABLED:-true}"
      SBR_BACKEND_ADMIN_LISTEN_ADDR: "${SBR_BACKEND_C_ADMIN_LISTEN_ADDR:-0.0.0.0:9090}"
      SBR_BACKEND_ADMIN_TOKEN: "${SBR_BACKEND_ADMIN_TOKEN:?SBR_BACKEND_ADMIN_TOKEN is required when experimental administration is enabled}"
    ports:
      - "127.0.0.1:${SBR_BACKEND_C_ADMIN_PORT:-19093}:9090"
    networks:
      - default
