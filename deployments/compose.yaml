name: self-balancing-router

services:
  proxy:
    image: self-balancing-router/proxy
    build:
      context: ..
      dockerfile: deployments/Dockerfile.proxy
    read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 20s
    networks:
      - default
      - ingress

  backend-a: &backend
    image: self-balancing-router/backend
    build:
      context: ..
      dockerfile: deployments/Dockerfile.backend
    read_only: true
  backend-b:
    <<: *backend
  backend-c:
    <<: *backend

networks:
  default:
    internal: true
  ingress: {}
